# /etc/litestream.yml — continuously replicates the SQLite database to S3-compatible storage
# (Cloudflare R2, Backblaze B2, AWS S3...). Restore with: litestream restore -o app.db <replica-url>
# Run as a service: sudo systemctl enable --now litestream
dbs:
  - path: /srv/driver-booking/apps/api/data/app.db
    replicas:
      - type: s3
        bucket: YOUR_BUCKET
        path: driver-booking
        endpoint: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
        access-key-id: YOUR_KEY_ID
        secret-access-key: YOUR_SECRET
        retention: 720h
